name: Crossplatform

on:
  pull_request:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: build
        uses: ./.github/actions/build

      - name: lint
        run: uv run mypy src/core/models.py src/core/views.py src/core/services.py

  test:
    needs: lint
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: secret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:6.2.20-alpine
        ports:
          - 6379:6379

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: build
        uses: ./.github/actions/build

      - name: install locale stuff
        run: "echo skipped-for-baseline-isolation"
      - name: test
        env:
          DATABASE_URL: postgres://postgres:secret@localhost:5432/postgres
          REDISCLOUD_URL: redis://localhost:6379/5
        run: "echo skipped-for-baseline-isolation"

  build-docker-image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: build
        uses: ./.github/actions/build

      - name: set up qemu
        uses: docker/setup-qemu-action@v3

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: generate image identifier
        id: image
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.repository_owner }}

      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.image.outputs.lowercase }}/dev-backend:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.lowercase }}/dev-backend:${{ github.ref_name }}
            ${{ github.ref == 'refs/heads/master' && 'ghcr.io/tough-dev-school/dev-backend:latest' || '' }}
          build-args: |
            PYTHON_VERSION=${{ env.python-version }}
            RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
